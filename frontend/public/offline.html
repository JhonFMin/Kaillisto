<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090d" />
    <title>Sin conexión · Ka’illisto</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #09090d; color: #f6f2fb; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(460px, 100%); padding: 32px; border: 1px solid #39313f; border-radius: 20px; background: #111016; }
      img { width: 48px; height: 48px; }
      h1 { margin: 22px 0 8px; font-size: 28px; font-weight: 600; }
      p { margin: 0 0 24px; color: #c0bac8; }
      button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 24px; background: #f3eaff; color: #17111d; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid #c294ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="" />
      <h1>Sin conexión por ahora</h1>
      <p>Conéctate a internet para consultar tus instalaciones y novedades. Cuando vuelvas a tener señal, intenta de nuevo.</p>
      <button type="button" onclick="location.reload()">Intentar de nuevo</button>
    </main>
  </body>
</html>
